name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/fable-5-agent-orchestration-cnm9pb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'scripts' \
            --exclude 'README.md' \
            --exclude 'about.html' \
            --exclude 'contact.html' \
            --exclude 'services.html' \
            --exclude 'css/styles.css' \
            --exclude 'js/main.js' \
            ./ _site/
          touch _site/.nojekyll

      # This is a preview host, not the production domain. Keep it out of
      # search results so it cannot outrank emergingmarketft.com later.
      - name: Mark the preview as noindex
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
